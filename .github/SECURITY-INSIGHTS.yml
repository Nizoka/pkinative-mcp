# pkinative-mcp — OpenSSF Security Insights (specification 2.0.0).
# https://github.com/ossf/security-insights
# Every statement here must stay true of SECURITY.md, package.json,
# server.json and .github/workflows/; update this file in the same change as
# any of them.
header:
  schema-version: 2.0.0
  last-updated: '2026-10-13'
  last-reviewed: '2026-10-13'
  url: https://raw.githubusercontent.com/Nizoka/pkinative-mcp/main/.github/SECURITY-INSIGHTS.yml
  comment: >-
    Every statement here can be read in the repository: SECURITY.md,
    package.json, server.json and the workflows under .github/workflows/.

project:
  name: pkinative-mcp
  homepage: https://github.com/Nizoka/pkinative-mcp
  administrators:
    - name: Nizoka
      primary: true
      social: https://github.com/Nizoka
  repositories:
    - name: pkinative-mcp
      url: https://github.com/Nizoka/pkinative-mcp
      comment: The MCP server, its tests, its samples and its conformance corpus.
    - name: pkinative
      url: https://github.com/Nizoka/pkinative
      comment: The PKI engine the server wraps, where every PKI decision is made.
    - name: pkinative-cli
      url: https://github.com/Nizoka/pkinative-cli
      comment: The sibling command line over the same engine; the key views and the wire form are vendored from it.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Nizoka
      primary: true
      social: https://github.com/Nizoka
    security-policy: https://github.com/Nizoka/pkinative-mcp/blob/main/SECURITY.md
    comment: >-
      Report privately, never in a public issue, through GitHub private
      vulnerability reporting:
      https://github.com/Nizoka/pkinative-mcp/security/advisories/new. A
      vulnerability in the pkinative engine itself is reported to
      https://github.com/Nizoka/pkinative/security/advisories/new. The
      handling timeline and the credit are in SECURITY.md.
  documentation:
    detailed-guide: https://github.com/Nizoka/pkinative-mcp/blob/main/README.md
    code-of-conduct: https://github.com/Nizoka/pkinative-mcp/blob/main/CODE_OF_CONDUCT.md
    release-process: https://github.com/Nizoka/pkinative-mcp/blob/main/CONTRIBUTING.md#release
    signature-verification: https://github.com/Nizoka/pkinative-mcp/blob/main/SECURITY.md

repository:
  url: https://github.com/Nizoka/pkinative-mcp
  status: active
  accepts-change-request: true
  # Dependabot opens the automated ones (.github/dependabot.yml).
  accepts-automated-change-request: true
  core-team:
    - name: Nizoka
      primary: true
      social: https://github.com/Nizoka
  license:
    url: https://github.com/Nizoka/pkinative-mcp/blob/main/LICENSE
    expression: MIT
  documentation:
    contributing-guide: https://github.com/Nizoka/pkinative-mcp/blob/main/CONTRIBUTING.md
    security-policy: https://github.com/Nizoka/pkinative-mcp/blob/main/SECURITY.md
  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://www.npmjs.com/package/pkinative-mcp
        comment: >-
          npm, published by .github/workflows/publish.yml on a published GitHub
          Release, through Trusted Publishing (OIDC) with provenance.
      - uri: https://github.com/Nizoka/pkinative-mcp/releases
        comment: >-
          GitHub Releases, published by the maintainer; each one triggers the
          publish workflow, which attaches the tarball, the CycloneDX SBOM and
          their Sigstore attestation.
    changelog: https://github.com/Nizoka/pkinative-mcp/blob/main/CHANGELOG.md
  security:
    assessments:
      self:
        comment: >-
          The adversarial release audit run before every release
          (.claude/skills/release-audit/): two auditors, a verifier and a
          GO/NO-GO ledger. Coverage thresholds of 94/90/95/94 enforced by the
          gate, secret-leak needle tests over every key and password result,
          OpenSSL 3 interoperability on four runner images (interop.yml) and
          hostile-input tests at the tools/call boundary. The server contains
          no network code path, generates no key and never writes a
          key-bearing file; resources/read refuses key material by content,
          not by name. There is no coverage-guided fuzzing and no third-party
          audit.
        evidence: https://github.com/Nizoka/pkinative-mcp/blob/main/SECURITY.md
    tools:
      - name: CodeQL
        type: SAST
        rulesets: [default]
        integration: { adhoc: false, ci: true, release: false }
        results: {}
        comment: TypeScript, on every push and pull request to main and weekly (codeql.yml).
      - name: OpenSSL
        type: other
        rulesets: [default]
        integration: { adhoc: true, ci: true, release: true }
        results: {}
        comment: >-
          The external conformance judge: every artefact the tools write is
          verified by OpenSSL 3 and the tools read what OpenSSL writes, on
          ubuntu-22.04, ubuntu-24.04, windows-latest and macos-latest
          (interop.yml, required on ubuntu-24.04 and windows-latest), inside
          the CI gate on every platform (ci.yml) and in the publish gate
          (publish.yml), with PKINATIVE_INTEROP_REQUIRED=1 so a missing judge
          fails rather than skips.
      - name: zlint
        type: other
        rulesets: [RFC5280, RFC5480, RFC5891, RFC3279, RFC8813, Community]
        integration: { adhoc: false, ci: false, release: true }
        results: {}
        comment: Lints every certificate the corpus writes in the publish gate (publish.yml); pinned v3.7.2 by archive hash; installed only when scripts/data/lint-python-requirements.txt is present.
      - name: pkilint
        type: other
        rulesets: [lint_pkix_cert, lint_pkix_signer_signee_cert_chain]
        integration: { adhoc: false, ci: false, release: true }
        results: {}
        comment: DigiCert pkilint over the same certificates, pinned by version and file hash (scripts/data/lint-python-requirements.txt); same condition as zlint.
      - name: npm audit
        type: SCA
        rulesets: [default]
        integration: { adhoc: true, ci: true, release: false }
        results: {}
        comment: The lockfile against the npm advisory database on every push and pull request (ci.yml) and weekly (audit.yml), at audit-level high.
      - name: Dependabot
        type: SCA
        rulesets: [default]
        integration: { adhoc: false, ci: true, release: false }
        results: {}
        comment: Weekly update pull requests for npm and GitHub Actions (.github/dependabot.yml).
      - name: Dependency Review
        type: SCA
        rulesets: [default]
        integration: { adhoc: false, ci: true, release: false }
        results: {}
        comment: The dependency changes of every pull request, with a licence allow-list (dependency-review.yml); three runtime dependencies is a hard rule.
      - name: Scorecard
        type: other
        rulesets: [default]
        integration: { adhoc: false, ci: true, release: false }
        results: {}
        comment: OpenSSF Scorecard on every push to main and weekly (scorecard.yml).
