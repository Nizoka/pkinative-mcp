name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Trusted Publishing (npmjs.com OIDC):
#   This workflow uses npm Trusted Publishing — no long-lived NPM_TOKEN secret.
#   The OIDC id-token permission mints a short-lived token that:
#     1. Authorises the `npm publish` HTTP request
#     2. Signs the provenance attestation (SLSA Level 2+ via Sigstore)
#   Configure at npmjs.com → package settings → "Configure Trusted Publishing",
#   bound to this file AND to the `npm-publish` environment below.
#
# Human-in-the-loop: the maintainer creates the GitHub release (the trigger)
# and approves the `npm-publish` environment; nothing here opens or edits a
# release, the attest job only attaches files to one that already exists.
permissions:
  contents: read

# One release at a time, and a running publish is never cancelled half-way.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A protected environment (required reviewer) gates the OIDC token: the
    # job cannot mint one before the maintainer approves the run.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Audit mode for the first two weeks, then switch to `egress-policy: block`
      # with the endpoints this job actually reaches:
      #   allowed-endpoints: >
      #     github.com:443
      #     api.github.com:443
      #     registry.npmjs.org:443
      #     nodejs.org:443
      #     release-assets.githubusercontent.com:443   (the zlint release archive)
      #     pypi.org:443                               (pkilint, hash-pinned)
      #     files.pythonhosted.org:443
      #     fulcio.sigstore.dev:443
      #     rekor.sigstore.dev:443
      #     tuf-repo-cdn.sigstore.dev:443
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # The release is built on the Node line .nvmrc names — the same one
          # contributors develop on — not on whatever ">= floor" resolves to.
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Read the version and check it against the tag
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "Publishing pkinative-mcp ${VERSION} from ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"

      # Node 22 ships npm 10.9; Trusted Publishing (OIDC, provenance) needs
      # npm ≥ 11.5.1. The client is pinned to one exact release so the bytes
      # that publish are the same on every run — the server itself is still
      # built and tested on the .nvmrc line.
      - name: Install the pinned npm client
        run: |
          set -euo pipefail
          npm install -g npm@11.19.1
          test "$(npm --version)" = "11.19.1"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # OpenSSL 3 is the external judge of the publish gate (corpus:pki,
      # validate:pki, test:interop); ubuntu-latest carries it on PATH, so there
      # is nothing to expose here — only the version to record.
      - name: Record the OpenSSL version
        run: openssl version

      # The two certificate linters (zlint, pkilint) lint every certificate the
      # corpus writes. pkilint is pinned by version and by the SHA-256 of every
      # wheel in scripts/data/lint-python-requirements.txt; when that file is
      # absent the linters are not installed and the gate runs without
      # REQUIRE_LINT (its lint step skips instead of failing the release).
      - name: Decide whether the certificate linters can be installed
        id: lint
        run: |
          if [ -f scripts/data/lint-python-requirements.txt ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo '::notice::scripts/data/lint-python-requirements.txt is absent; zlint and pkilint are not installed and REQUIRE_LINT is not set.'
          fi

      - name: Install zlint (pinned, checksum-verified)
        if: steps.lint.outputs.available == 'true'
        env:
          ZLINT_VERSION: 3.7.2
          ZLINT_SHA256: c2788575fc44da2648fcf9cfcdc1dae4d388d80a2b8edf9aafb215425cad4cc5
        run: |
          set -euo pipefail
          ARCHIVE="zlint_${ZLINT_VERSION}_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "${RUNNER_TEMP}/${ARCHIVE}" \
            "https://github.com/zmap/zlint/releases/download/v${ZLINT_VERSION}/${ARCHIVE}"
          echo "${ZLINT_SHA256}  ${RUNNER_TEMP}/${ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}"

      - name: Install pkilint (pinned by hash)
        if: steps.lint.outputs.available == 'true'
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/lint-python"
          "${RUNNER_TEMP}/lint-python/bin/python" -m pip install --require-hashes --no-deps --only-binary :all: -r scripts/data/lint-python-requirements.txt

      # Every gate step — typecheck, lint, build, dist, the built server's
      # stdio smoke test, the catalogue fixture, server.json, coverage, docs,
      # samples against the baseline chain, the conformance corpus through
      # OpenSSL, the interoperability suite and (publish profile only) the
      # certificate linters. --require-all: a missing tool fails the release
      # instead of skipping; REQUIRE_LINT, ZLINT and PKILINT_PYTHON only when
      # the linters were installed above, so the lint:certs step skips (not
      # fails) on a tree without the requirements file.
      - name: Run the quality gate (publish profile)
        env:
          PKINATIVE_INTEROP_REQUIRED: '1'
          REQUIRE_LINT: ${{ steps.lint.outputs.available == 'true' && '1' || '' }}
          ZLINT: ${{ steps.lint.outputs.available == 'true' && format('{0}/zlint_3.7.2_Linux_x86_64/zlint', runner.temp) || '' }}
          PKILINT_PYTHON: ${{ steps.lint.outputs.available == 'true' && format('{0}/lint-python/bin/python', runner.temp) || '' }}
        run: npx tsx scripts/gate.ts --publish --require-all

      - name: Show the package contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --provenance --access public

  # Attests the tarball and a CycloneDX SBOM built from the same commit, and
  # attaches both to the GitHub release when the maintainer has created it.
  attest:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.publish.outputs.version }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # .npmrc sets ignore-scripts, so prepublishOnly does not run for
      # `npm pack`: build explicitly, as the gate did in the publish job.
      - name: Build
        run: npm run build

      # Three runtime dependencies (pkinative, the MCP SDK, zod) and their trees.
      - name: Generate the SBOM (CycloneDX, runtime dependencies only)
        run: npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > "pkinative-mcp-${VERSION}.cdx.json"

      - name: Pack the tarball
        run: |
          set -euo pipefail
          npm pack
          test -f "pkinative-mcp-${VERSION}.tgz"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            pkinative-mcp-${{ env.VERSION }}.tgz
            pkinative-mcp-${{ env.VERSION }}.cdx.json

      # The release is created by the maintainer (human-in-the-loop); on a
      # workflow_dispatch without one, the artefacts stay in the attestation
      # store and nothing is created here.
      - name: Attach the tarball and SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "pkinative-mcp-${VERSION}.tgz" "pkinative-mcp-${VERSION}.cdx.json" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            echo "::notice::No GitHub release v${VERSION} exists; the tarball and SBOM were attested but not attached."
          fi
