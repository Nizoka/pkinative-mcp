name: Dependency Review

# Blocks a pull request that introduces a dependency with a known high or
# critical vulnerability, or one under a licence outside the allow-list.
# pkinative-mcp has exactly three runtime dependencies (pkinative, the MCP SDK,
# zod), so this covers the dev toolchain and any attempt to add a fourth
# runtime one — the project's first hard rule (.github/AGENT_RULES.md rule 1).
#
# Needs the repository's Dependency graph enabled (Settings → Code security).

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed for comment-summary-in-pr.
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, Unlicense
          # scripts/data/lint-python-requirements.txt pins pkilint and its tree for the
          # publish-profile linter (tests/interop/lint.test.ts): a tool that runs on the CI
          # runner, never a dependency of the package, hash-pinned (`--require-hashes`).
          # Four of them carry licences the allow-list does not name (MIT-0, MPL-2.0 and
          # public-domain terms); they are exempted by package, not by licence, so a new
          # licence anywhere else still blocks.
          allow-dependencies-licenses: pkg:pypi/cffi, pkg:pypi/iso4217, pkg:pypi/pkilint, pkg:pypi/publicsuffixlist
          comment-summary-in-pr: on-failure
