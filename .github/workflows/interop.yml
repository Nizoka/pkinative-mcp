name: OpenSSL interoperability

# OpenSSL 3 is the external conformance judge of this server, the way veraPDF
# judges pdfnative-mcp: it verifies the certificates, requests, CMS signatures
# and time-stamp requests the BUILT tools write, and the tools read what
# OpenSSL writes (tests/interop/openssl.test.ts). The corpus is produced by the
# tool handlers themselves (scripts/generate-pki-corpus.ts → test-output/pki/),
# then scripts/validate-pki.ts runs every entry through OpenSSL and compares the
# verdict with the manifest's expectation; negative canaries OpenSSL MUST
# reject are included, so a judge that accepts everything fails the run (an
# unexpected pass — XPASS — is fatal).
#
# Status: BLOCKING on ubuntu-24.04 and windows-latest, which are the required
# checks `interop (ubuntu-24.04)` and `interop (windows-latest)`
# (.github/rulesets/main.json). ubuntu-22.04 (OpenSSL 3.0, no PBMAC1) and
# macos-latest (Homebrew OpenSSL 3 next to the system LibreSSL) run on every
# push too but are not required: their OpenSSL builds differ in ways that are
# theirs, and a red run there is a report, not a merge blocker.
# PKINATIVE_INTEROP_REQUIRED=1 turns "openssl not found" into a failure rather
# than a skip, so a runner image change can never make the judge disappear.
#
# No `paths:` filter: a required check that never reports leaves the pull
# request on "Expected — waiting for status" forever (see sample-regression.yml).
#
# OpenSSL is an external CI tool installed on the runner image. It is not a
# dependency of pkinative-mcp: the package keeps its three runtime
# dependencies (pkinative, the MCP SDK, zod), and the judge is never bundled.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id and the matrix are load-bearing: the status-check names are
  # `interop (<os>)`.
  interop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PKINATIVE_INTEROP_REQUIRED: '1'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest, macos-latest]

    steps:
      # harden-runner: Linux and Windows (audit mode only on Windows); the
      # action does not support macOS, so the step is skipped there.
      - name: Harden the runner
        if: runner.os != 'macOS'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Git for Windows ships OpenSSL 3 under its usr/bin; the image has no
      # other `openssl` on PATH.
      - name: Expose OpenSSL 3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = 'C:\Program Files\Git\usr\bin'
          if (-not (Test-Path (Join-Path $bin 'openssl.exe'))) { throw "openssl.exe not found under $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      # macOS answers `openssl` with LibreSSL; Homebrew carries OpenSSL 3.
      - name: Expose OpenSSL 3 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX=$(brew --prefix openssl@3)
          test -x "${PREFIX}/bin/openssl"
          echo "${PREFIX}/bin" >> "$GITHUB_PATH"

      # Recorded first, so a red run names the judge that produced it.
      - name: Record tool versions
        shell: bash
        run: |
          {
            echo '## Interoperability tool versions'
            echo '```'
            echo "node $(node --version), bundled OpenSSL $(node -p process.versions.openssl)"
            openssl version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          openssl version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The corpus generator drives dist/server.js, never the source tree.
      - name: Build
        run: npm run build

      - name: Generate the conformance corpus
        run: npm run corpus:pki

      # BLOCKING on the required legs (see header). The exit code drives the
      # step outcome — the step fails naturally on a non-zero exit — and the
      # summary step below surfaces the verdict. Exit codes of
      # scripts/validate-pki.ts: 0 all expectations met · 1 conformance FAIL /
      # XPASS / coverage canary · 2 INFRA (no corpus, OpenSSL unusable or no
      # report — not a verdict) · 3 OpenSSL absent while
      # PKINATIVE_INTEROP_REQUIRED=1 (the runner image lost its judge).
      - name: Validate the corpus with OpenSSL (blocking)
        id: validate
        shell: bash
        run: |
          set +e
          npm run validate:pki --silent -- --verbose 2> >(tee openssl-stderr.txt >&2) | tee openssl-report.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "${code}"

      # The read direction: OpenSSL writes, the tools read and verify.
      - name: OpenSSL interoperability suite
        run: npm run test:interop

      # Raw per-entry OpenSSL output (+ stderr when non-empty) lives under
      # test-output/pki/reports/ — upload it so a FAIL / INFRA line can be
      # diagnosed without re-running the job.
      - name: Upload the OpenSSL report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssl-report-${{ matrix.os }}
          path: |
            openssl-report.txt
            openssl-stderr.txt
            test-output/pki/manifest.json
            test-output/pki/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: always()
        shell: bash
        run: |
          code='${{ steps.validate.outputs.exit_code }}'
          case "${code}" in
            0) verdict='all expectations met' ;;
            1) verdict='CONFORMANCE failure (FAIL, XPASS or coverage canary — see report)' ;;
            2) verdict='INFRA failure — no corpus, OpenSSL unusable or no report (NOT a conformance verdict)' ;;
            3) verdict='INFRA failure — OpenSSL not found although PKINATIVE_INTEROP_REQUIRED=1 (NOT a conformance verdict)' ;;
            *) verdict="unknown (exit ${code:-n/a})" ;;
          esac
          {
            echo "## OpenSSL interoperability (${{ matrix.os }})"
            echo
            echo "Step outcome: ${{ steps.validate.outcome }} · exit ${code:-n/a} · ${verdict}"
            echo
            echo '```'
            cat openssl-report.txt 2>/dev/null || echo "(no report produced)"
            echo '```'
            if [ -s openssl-stderr.txt ]; then
              echo
              echo '<details><summary>validator stderr</summary>'
              echo
              echo '```'
              cat openssl-stderr.txt
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
